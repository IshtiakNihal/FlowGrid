<svg width="2400" height="1950" viewBox="0 0 2400 1950" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="2400" height="1950" fill="#F4F1E8"/>
<rect x="80" y="80" width="2240" height="140" fill="#183B35" rx="4"/>
<text x="120" y="145" fill="#F4F1E8" font-family="'Bodoni Moda', serif" font-size="36" font-weight="600">FlowGrid — Strategic Foundations &amp; Research Audit (v3)</text>
<text x="120" y="185" fill="#DEE7E2" font-family="'Manrope', sans-serif" font-size="18">Visual direction, architectural references, live social media audit, and local Bangladeshi design context</text>
<rect x="80" y="260" width="700" height="780" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="80" y="260" width="700" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="110" y="300" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">01. Three Entities &amp; Boundary Governance</text>
<text x="110" y="355" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">1. FlowGrid (Interior Architecture Studio)</text>
<text x="110" y="385" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Core Scope: Space planning, bespoke joinery, family living</tspan><tspan x="110" dy="22">solutions, and design consultation.</tspan></text>
<text x="110" y="435" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Identity: Independent studio serving urban Bangladeshi homeowners</tspan><tspan x="110" dy="22">with custom joinery.</tspan></text>
<text x="110" y="485" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Studio Location: Mirpur, Dhaka 1216 (provisional/observed on</tspan><tspan x="110" dy="22">Facebook).</tspan></text>
<text x="110" y="535" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="600"><tspan x="110" dy="0">• Boundary Rule: Not an appliance retailer; not an influencer fan</tspan><tspan x="110" dy="22">club; not a construction contractor.</tspan></text>
<text x="110" y="600" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">2. Rumi's Fashionable House (Community Sibling)</text>
<text x="110" y="630" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Presence: 140,000 subscribers, 2,368 videos, 36.6M views on</tspan><tspan x="110" dy="22">YouTube (verified).</tspan></text>
<text x="110" y="680" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Audience Focus: Family lifestyle vlogs, home cooking, and</tspan><tspan x="110" dy="22">community trust.</tspan></text>
<text x="110" y="730" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="600"><tspan x="110" dy="0">• Boundary Rule: Rumi is a lifestyle vlogger/founder context, NOT an</tspan><tspan x="110" dy="22">architect. Do NOT imply architectural credentials or lack thereof.</tspan></text>
<text x="110" y="800" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">3. Onekta Product (Retail Sibling)</text>
<text x="110" y="830" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Focus: Small appliances, practical household tools, and consumer</tspan><tspan x="110" dy="22">kitchen items.</tspan></text>
<text x="110" y="880" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="600"><tspan x="110" dy="0">• Boundary Rule: Completely separate commerce entity. FlowGrid does</tspan><tspan x="110" dy="22">NOT host shopping carts or sell appliances.</tspan></text>
<text x="110" y="950" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="110" dy="0">• Integration: Mentioned strictly as a trusted household resource</tspan><tspan x="110" dy="22">link in studio/footer.</tspan></text>
<rect x="850" y="260" width="700" height="780" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="850" y="260" width="700" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="880" y="300" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">02. Design Reference Synthesis Matrix</text>
<text x="880" y="355" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Era Residence (era-residence.com)</text>
<text x="880" y="385" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Adopted: Warm paper background, Bodoni Moda serif headlines,</tspan><tspan x="880" dy="22">generous architectural whitespace.</tspan></text>
<text x="880" y="440" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Omitted: Commercial apartment-sales listings, apartment selector</tspan><tspan x="880" dy="22">tools, luxury resort rhetoric.</tspan></text>
<text x="880" y="510" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Thirdway (thirdway.com)</text>
<text x="880" y="540" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Adopted: Clear structured project briefs (Brief → Decisions →</tspan><tspan x="880" dy="22">Specs), identifiable team roles, visible contact.</tspan></text>
<text x="880" y="600" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Omitted: Corporate office fit-out positioning, animated ticker</tspan><tspan x="880" dy="22">noise, multi-corporate bureaucracy.</tspan></text>
<text x="880" y="670" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Quinta da Malia (quintadamalia.com)</text>
<text x="880" y="700" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Adopted: Restrained unhurried pacing, soft natural daylighting,</tspan><tspan x="880" dy="22">calm editorial rhythm.</tspan></text>
<text x="880" y="755" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Omitted: Pill buttons, glow gradients, floating glassmorphism,</tspan><tspan x="880" dy="22">vacation retreat framing.</tspan></text>
<text x="880" y="830" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Local Architectural Precedents (Cubeinside / Morphogenesis)</text>
<text x="880" y="860" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Adopted: Teak wood joinery, woven cane panels, resilient granite,</tspan><tspan x="880" dy="22">cross-ventilation, balcony plants.</tspan></text>
<text x="880" y="920" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="880" dy="0">• Omitted: 50th-floor floor-to-ceiling glass walls, cold</tspan><tspan x="880" dy="22">glass/steel, indoor pools.</tspan></text>
<rect x="1620" y="260" width="700" height="780" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="1620" y="260" width="700" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="1650" y="300" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">03. Dhaka Spatial &amp; Cultural Realities</text>
<text x="1650" y="355" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Urban Apartment Ceilings &amp; Storage Density</text>
<text x="1650" y="385" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Standard 9.5-foot structural slab height limits suspended</tspan><tspan x="1650" dy="22">ceilings; prioritized vertical joinery.</tspan></text>
<text x="1650" y="440" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Intense storage requirements: seasonal quilts, suitcases, books,</tspan><tspan x="1650" dy="22">and crockery need closed floor-to-ceiling millwork.</tspan></text>
<text x="1650" y="520" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Kitchen &amp; Culinary Demands</text>
<text x="1650" y="550" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Heavy daily Bengali cooking involves turmeric, mustard oil, and</tspan><tspan x="1650" dy="22">spices requiring stain-resistant surfaces.</tspan></text>
<text x="1650" y="605" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Liquid Petroleum Gas (LPG) cylinder integration requires dedicated</tspan><tspan x="1650" dy="22">lower ventilated cabinetry.</tspan></text>
<text x="1650" y="680" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Dhaka Climate &amp; Monsoon Humidity</text>
<text x="1650" y="710" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• High relative humidity requires breathable woven cane inserts and</tspan><tspan x="1650" dy="22">moisture-resistant finishes.</tspan></text>
<text x="1650" y="765" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Veranda grilles and natural daylighting integration are central to</tspan><tspan x="1650" dy="22">urban apartment living.</tspan></text>
<text x="1650" y="840" fill="#183B35" font-family="'Manrope', sans-serif" font-size="17" font-weight="700">Family Multi-Generational Living</text>
<text x="1650" y="870" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Living and dining areas must comfortably seat extended family</tspan><tspan x="1650" dy="22">gatherings and prayer routines.</tspan></text>
<text x="1650" y="925" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1650" dy="0">• Acoustically isolated bedroom study alcoves support quiet work-</tspan><tspan x="1650" dy="22">from-home focus in compact apartments.</tspan></text>
<rect x="80" y="1080" width="1100" height="780" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="80" y="1080" width="1100" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="110" y="1120" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">04. Single Owner Fact &amp; Operational Register</text>
<text x="110" y="1170" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Studio Location:</text>
<text x="310" y="1170" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Mirpur, Dhaka 1216 (provisional: Mirpur-10 observed on Facebook). Requires</tspan><tspan x="310" dy="20">owner confirmation.</tspan></text>
<text x="110" y="1242" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Contact Telephone:</text>
<text x="310" y="1242" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Provisional placeholder: +880 1700-000000 (observed FB: 01712-402422</tspan><tspan x="310" dy="20">pending owner verification).</tspan></text>
<text x="110" y="1314" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Studio Email:</text>
<text x="310" y="1314" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">hello@flowgrid-interiors.com (provisional placeholder pending production</tspan><tspan x="310" dy="20">domain setup).</tspan></text>
<text x="110" y="1386" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Production Domain:</text>
<text x="310" y="1386" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">www.flowgrid-interiors.com (DNS confirmed not yet active; pending client</tspan><tspan x="310" dy="20">hosting setup).</tspan></text>
<text x="110" y="1458" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Wordmark &amp; Logo:</text>
<text x="310" y="1458" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Proposed typographic wordmark (Bodoni Moda / Noto Sans Bengali). Final</tspan><tspan x="310" dy="20">vector asset pending owner.</tspan></text>
<text x="110" y="1530" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Commercial Model:</text>
<text x="310" y="1530" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Design consultancy, custom joinery fabrication, and turnkey supervision</tspan><tspan x="310" dy="20">(pending contract scope review).</tspan></text>
<text x="110" y="1602" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Initial Site Visit:</text>
<text x="310" y="1602" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Provisional spatial assessment (pricing policy pending owner confirmation).</tspan></text>
<text x="110" y="1674" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Rumi Context:</text>
<text x="310" y="1674" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="310" dy="0">Founder / community lifestyle connection. Strictly distinct from</tspan><tspan x="310" dy="20">architectural licensure.</tspan></text>
<rect x="1220" y="1080" width="1100" height="780" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="1220" y="1080" width="1100" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="1250" y="1120" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">05. Restrained Architectural Motion Guidance</text>
<text x="1250" y="1175" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Hero Reveal Sequence (600ms)</text>
<text x="1250" y="1199" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">Center hairline split opens dual-wing horizontal mask wipe (cubic-bezier(0.23, 1, 0.32,</tspan><tspan x="1250" dy="22">1)). Headline text and primary CTA remain immediately visible and interactive to ensure</tspan><tspan x="1250" dy="22">zero delayed usability.</tspan></text>
<text x="1250" y="1295" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Calm Project Card Hover (360ms)</text>
<text x="1250" y="1319" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">Zero vertical lift (0px), zero shadow explosion. Subtle 1.015 image scale within strict</tspan><tspan x="1250" dy="22">squared 0px radius frame. Easing: cubic-bezier(0.23, 1, 0.32, 1).</tspan></text>
<text x="1250" y="1393" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Tactile Button Micro-Interactions</text>
<text x="1250" y="1417" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">150ms background color shift (#183B35 -&gt; #102B26). 100ms press scale(0.99). High-contrast</tspan><tspan x="1250" dy="22">focus outline (2px #895239 with 2px offset).</tspan></text>
<text x="1250" y="1491" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Mobile Navigation Drawer (220ms / 160ms)</text>
<text x="1250" y="1515" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">220ms smooth ease-out slide-in from right; 160ms ease-in slide-out. Backdrop opacity 0.5</tspan><tspan x="1250" dy="22">pine overlay.</tspan></text>
<text x="1250" y="1589" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Accordion Expand/Collapse (180ms)</text>
<text x="1250" y="1613" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">180ms ease-in-out height transition. Icon rotates 90 degrees (+ to -).</tspan></text>
<text x="1250" y="1665" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Accessible Reduced Motion Architecture</text>
<text x="1250" y="1689" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1250" dy="0">@media (prefers-reduced-motion: reduce) collapses all animation durations to 0ms.</tspan><tspan x="1250" dy="22">Essential content, navigation, and enquiry forms render instantly without transitions.</tspan></text>
</svg>