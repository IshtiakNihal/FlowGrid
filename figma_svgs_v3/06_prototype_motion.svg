<text x="1420" y="665" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="1420" dy="0">Mask width reaches 85% coverage. Interior photography</tspan><tspan x="1420" dy="20">opacity deepens. Subtle 12px whole-line upward settle (no</tspan><tspan x="1420" dy="20">per-letter splitting).</tspan></text>
