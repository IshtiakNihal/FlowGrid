<text x="110" y="300" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">01. Signature Hero Reveal Sequence (600ms · Immediate Headline Usability · Easing: cubic-bezier(0.23, 1, 0.32, 1))</text>
<rect x="110" y="350" width="600" height="440" fill="#F4F1E8" stroke="#B8C2BA" stroke-width="1" rx="4"/>
