<text x="2050" y="376" fill="#183B35" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">T = 600ms · Fully Settled Canvas</text>
<rect x="2060" y="410" width="540" height="230" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1"/>
<text x="2080" y="445" fill="#183B35" font-family="'Bodoni Moda', serif" font-size="16" font-weight="700">Quiet Architecture</text>
<rect x="2080" y="460" width="100" height="24" fill="#183B35" rx="2"/>
<text x="2130" y="476" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="10" text-anchor="middle">Book</text>
<rect x="2080" y="500" width="500" height="120" fill="#183B35" fill-opacity="0.9"/>
<text x="2330" y="565" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="12" text-anchor="middle">[ Settled Photography ]</text>
<text x="2060" y="665" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="2060" dy="0">Mask wipe completes with crisp 0px architectural bounds.</tspan><tspan x="2060" dy="20">Focus rings and cursor interactions active with 100%</tspan><tspan x="2060" dy="20">responsiveness.</tspan></text>
<rect x="80" y="880" width="1300" height="740" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="80" y="880" width="1300" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="110" y="920" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">02. Project Card Kinetics &amp; Case Study Expansion</text>
<text x="110" y="980" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Restrained Hover Specification (No 8px Jumps · Zero Shadow Explosion):</text>
<text x="110" y="1010" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Duration: 360ms cubic-bezier(0.23, 1, 0.32, 1).</text>
<text x="110" y="1036" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Vertical Translation: Strict 0px (Card does NOT lift or float off the paper canvas).</text>
<text x="110" y="1062" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Shadow: Zero drop shadow change (preserves calm, flat architectural editorial aesthetic).</text>
<text x="110" y="1088" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Image Scale: Subtle 1.015 internal zoom strictly clipped to 0px border-radius container.</text>
<text x="110" y="1114" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Caption Shift: Link arrow advances +4px horizontally; title underline animates smoothly.</text>
<rect x="110" y="1170" width="360" height="380" fill="#F4F1E8" stroke="#B8C2BA" stroke-width="1" rx="2"/>
<rect x="110" y="1170" width="360" height="220" fill="#DEE7E2"/>
<text x="290" y="1285" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" text-anchor="middle">Project Card (400px)</text>
<text x="130" y="1425" fill="#183B35" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700">গুলশান লেকভিউ স্টাডি</text>
<text x="130" y="1455" fill="#895239" font-family="'Manrope', sans-serif" font-size="13">Click Action →</text>
<path d="M 500 1360 L 590 1360 M 575 1345 L 590 1360 L 575 1375" stroke="#895239" stroke-width="3" fill="none"/>
<text x="545" y="1335" fill="#895239" font-family="'Manrope', sans-serif" font-size="12" text-anchor="middle">360ms Shared Element</text>
<rect x="620" y="1170" width="720" height="380" fill="#F4F1E8" stroke="#183B35" stroke-width="1.5" rx="2"/>
<rect x="620" y="1170" width="720" height="260" fill="#183B35" fill-opacity="0.85"/>
<text x="980" y="1305" fill="#F4F1E8" font-family="'Bodoni Moda', serif" font-size="20" text-anchor="middle">Master Case Study Hero (1280px Viewport)</text>
<text x="650" y="1465" fill="#183B35" font-family="'Noto Sans Bengali', sans-serif" font-size="18" font-weight="700">সম্পূর্ণ ৩টি ভিউ ও ম্যাটেরিয়াল স্পেক্স লোডিং</text>
<text x="650" y="1495" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13">Scroll lock during 360ms expansion; zero layout shifting</text>
<rect x="1420" y="880" width="1300" height="740" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="1420" y="880" width="1300" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="1450" y="920" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">03. Unified Drawer Durations &amp; Working Prototype Flows</text>
<text x="1450" y="980" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Unified Mobile Navigation Drawer Timings:</text>
<text x="1450" y="1010" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Drawer Entrance: Exactly 220ms ease-out (cubic-bezier(0, 0, 0.2, 1)) horizontal slide from right.</text>
<text x="1450" y="1036" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Drawer Exit: Exactly 160ms ease-in (cubic-bezier(0.4, 0, 1, 1)) slide-out. Eliminates 240/300ms discrepancies.</text>
<text x="1450" y="1062" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Backdrop Overlay: 200ms linear opacity fade (#183B35 with 0.55 opacity).</text>
<text x="1450" y="1088" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14">• Focus Management: Focus traps to drawer 'Close (✕)' button immediately upon trigger.</text>
<rect x="1450" y="1150" width="1240" height="420" fill="#F4F1E8" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<text x="1480" y="1195" fill="#183B35" font-family="'Manrope', sans-serif" font-size="16" font-weight="700">Verified Interactive Prototype Flows in Figma:</text>
<text x="1480" y="1235" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Flow 1: Desktop Architectural Journey</text>
<text x="1480" y="1257" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="1480" dy="0">Home Hero CTA (3:4) → Concept Study Detail (3:4) → 3 Spatial Decisions Accordion → Consultation</tspan><tspan x="1480" dy="20">Enquiry Form (3:2 State 2) → Confirmation (State 5).</tspan></text>
<text x="1480" y="1307" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Flow 2: Mobile Navigation &amp; Enquiry</text>
<text x="1480" y="1329" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="1480" dy="0">Mobile Home (3:5) → 48px Hamburger Button → Off-Canvas Drawer Overlay → Projects Archive →</tspan><tspan x="1480" dy="20">4-Field Form Submission (3:5).</tspan></text>
<text x="1480" y="1379" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Flow 3: Bilingual Experience Switcher</text>
<text x="1480" y="1401" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="1480" dy="0">Header Language Button ('EN' / 'বাং') toggles smoothly between Bangla Master (3:4) and English</tspan><tspan x="1480" dy="20">Master (3:6) preserving scroll position.</tspan></text>
<text x="1480" y="1451" fill="#895239" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Flow 4: Direct Communication Triggers</text>
<text x="1480" y="1473" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="1480" dy="0">Primary Call and Accessible Dark Teal WhatsApp actions route immediately to verified contact</tspan><tspan x="1480" dy="20">protocols.</tspan></text>
<rect x="80" y="1660" width="2640" height="760" fill="#FFFFFF" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<rect x="80" y="1660" width="2640" height="60" fill="#183B35" rx="4 4 0 0"/>
<text x="110" y="1700" fill="#F4F1E8" font-family="'Manrope', sans-serif" font-size="20" font-weight="600">04. Accessible Reduced-Motion Architecture &amp; Production CSS Specification</text>
<rect x="110" y="1750" width="1300" height="620" fill="#183B35" rx="4"/>
<text x="140" y="1790" fill="#895239" font-family="monospace" font-size="14" font-weight="700">/* Authoritative prefers-reduced-motion CSS Token (WCAG 2.3.3 / Level AAA Support) */</text>
<text x="140" y="1825" fill="#F4F1E8" font-family="monospace" font-size="13">@media (prefers-reduced-motion: reduce) {</text>
<text x="140" y="1846" fill="#DEE7E2" font-family="monospace" font-size="13">  /* Collapse all kinetic durations to instantaneous transition */</text>
<text x="140" y="1867" fill="#DEE7E2" font-family="monospace" font-size="13">  *, *::before, *::after {</text>
<text x="140" y="1888" fill="#DEE7E2" font-family="monospace" font-size="13">    animation-duration: 0.01ms !important;</text>
<text x="140" y="1909" fill="#DEE7E2" font-family="monospace" font-size="13">    animation-iteration-count: 1 !important;</text>
<text x="140" y="1930" fill="#DEE7E2" font-family="monospace" font-size="13">    transition-duration: 0.01ms !important;</text>
<text x="140" y="1951" fill="#DEE7E2" font-family="monospace" font-size="13">    scroll-behavior: auto !important;</text>
<text x="140" y="1972" fill="#DEE7E2" font-family="monospace" font-size="13">  }</text>
<text x="140" y="1993" fill="#DEE7E2" font-family="monospace" font-size="13"></text>
<text x="140" y="2014" fill="#DEE7E2" font-family="monospace" font-size="13">  /* Immediate Hero Reveal — Zero Mask Wipe */</text>
<text x="140" y="2035" fill="#DEE7E2" font-family="monospace" font-size="13">  .hero-mask {</text>
<text x="140" y="2056" fill="#DEE7E2" font-family="monospace" font-size="13">    clip-path: none !important;</text>
<text x="140" y="2077" fill="#DEE7E2" font-family="monospace" font-size="13">    opacity: 1 !important;</text>
<text x="140" y="2098" fill="#DEE7E2" font-family="monospace" font-size="13">    transform: none !important;</text>
<text x="140" y="2119" fill="#DEE7E2" font-family="monospace" font-size="13">  }</text>
<text x="140" y="2140" fill="#DEE7E2" font-family="monospace" font-size="13"></text>
<text x="140" y="2161" fill="#DEE7E2" font-family="monospace" font-size="13">  /* Card Hover — Maintain Strict Flat Architectural Plane */</text>
<text x="140" y="2182" fill="#DEE7E2" font-family="monospace" font-size="13">  .project-card:hover .project-card__image {</text>
<text x="140" y="2203" fill="#DEE7E2" font-family="monospace" font-size="13">    transform: none !important;</text>
<text x="140" y="2224" fill="#DEE7E2" font-family="monospace" font-size="13">  }</text>
<text x="140" y="2245" fill="#DEE7E2" font-family="monospace" font-size="13"></text>
<text x="140" y="2266" fill="#DEE7E2" font-family="monospace" font-size="13">  /* Mobile Drawer — Instant Visibility Toggle Without Slide */</text>
<text x="140" y="2287" fill="#DEE7E2" font-family="monospace" font-size="13">  .mobile-drawer {</text>
<text x="140" y="2308" fill="#DEE7E2" font-family="monospace" font-size="13">    transition: none !important;</text>
<text x="140" y="2329" fill="#DEE7E2" font-family="monospace" font-size="13">    transform: translateX(0) !important;</text>
<text x="140" y="2350" fill="#DEE7E2" font-family="monospace" font-size="13">  }</text>
<text x="140" y="2371" fill="#DEE7E2" font-family="monospace" font-size="13">} /* Closing brace strictly verified */</text>
<rect x="1450" y="1750" width="1230" height="620" fill="#F4F1E8" stroke="#B8C2BA" stroke-width="1" rx="4"/>
<text x="1480" y="1800" fill="#183B35" font-family="'Manrope', sans-serif" font-size="18" font-weight="700">Clear Separation of Figma Prototype vs. Production Browser Reality:</text>
<text x="1480" y="1845" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">1. Figma Prototype Capability:</text>
<text x="1480" y="1869" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1480" dy="0">Figma demonstrates Smart Animate layer transitions, slide-in overlays, and click-to-</tspan><tspan x="1480" dy="22">navigate flows. It cannot natively evaluate OS-level CSS media queries like prefers-</tspan><tspan x="1480" dy="22">reduced-motion.</tspan></text>
<text x="1480" y="1960" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">2. Documented Specification Status:</text>
<text x="1480" y="1984" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1480" dy="0">The code shown on the left is the formal production engineering handoff</tspan><tspan x="1480" dy="22">specification. It guarantees that when frontend code is compiled, users with</tspan><tspan x="1480" dy="22">vestibular disorders receive an immediate, non-animated interface.</tspan></text>
<text x="1480" y="2075" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">3. Zero Usability Penalty:</text>
<text x="1480" y="2099" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1480" dy="0">In all versions (default or reduced motion), critical headline copy, studio telephone</tspan><tspan x="1480" dy="22">hotline, and consultation buttons are visible at T=0ms without requiring users to</tspan><tspan x="1480" dy="22">wait for animation completion.</tspan></text>
<text x="1480" y="2190" fill="#895239" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">4. Tested Browser Behavior:</text>
<text x="1480" y="2214" fill="#56645E" font-family="'Manrope', sans-serif" font-size="14" font-weight="400"><tspan x="1480" dy="0">The 600ms mask wipe uses CSS clip-path polygon transitions, which perform at 60fps on</tspan><tspan x="1480" dy="22">modern GPUs without repainting the entire document layout.</tspan></text>
</svg>