<text x="140" y="665" fill="#56645E" font-family="'Manrope', sans-serif" font-size="13" font-weight="400"><tspan x="140" dy="0">Hairline vertical center-split on warm paper. Headline text</tspan><tspan x="140" dy="20">and primary CTA button are immediately visible and clickable</tspan><tspan x="140" dy="20">(zero delayed usability).</tspan></text>
